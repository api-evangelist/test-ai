aid: test-ai
name: test.ai
description: >-
  test.ai (formerly Appdiff, Inc.) built an AI-powered test-automation platform that used computer
  vision and machine-learning element classification to make Selenium and Appium tests resilient to
  UI change. It published first-party Java, Python, Node.js and Ruby SDKs, a gRPC "Classifier"
  service that labelled UI elements from screenshots, an Appium classifier plugin, and OpenTestData
  — a free open database of automated test fixture data with its own REST API. The company raised
  over $30M and was sold; its founder has since moved on to other ventures. As of 2026-08-30 test.ai
  serves no website of its own: the domain has no HTTPS listener and every HTTP path redirects
  off-domain. The artifacts profiled here are the contracts and packages the company published while
  operating, all of which remain publicly retrievable from its own GitHub organization and from the
  npm, PyPI, RubyGems and Maven Central registries.
