- name: test.ai Classifier
  description: >-
    gRPC service that classifies UI element screenshots into semantic labels. A single RPC,
    ClassifyElements, takes a map of element id to PNG bytes plus a label hint, a confidence
    threshold and a weaker-match flag, and returns a per-element label with confidence scores.
    This is the engine behind the test.ai Appium classifier plugin and the Java, Python, Node.js
    and Ruby classifier clients. The server is run by the consumer, so there is no vendor-hosted
    base URL — the clients take host and port as constructor arguments.
  humanURL: https://github.com/testdotai/classifier-proto
