apis:
- name: OpenTestData API
  description: >-
    REST API behind opentestdata.org, test.ai's free and open database of automated test fixture
    data. 13 paths / 16 operations covering user signup and login, e-mail confirmation, avatars,
    admin promotion, test and datum create/read/update, and a combined search over tests and data.
    Authenticated with a JWT bearer token. The publicly hosted instance the provider documented,
    api.opentestdata.org, no longer resolves; the contract survives in the company's own repository.
  humanURL: https://github.com/testdotai/opentestdata-api
  baseURL: http://api.opentestdata.org
